spring:
  application:
    name: sample-batch-before
  datasource:
    url: jdbc:h2:mem:sample-batch-before;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    initialization-mode: always
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  batch:
    job:
      names: sampleJob
    initialize-schema: always
  h2:
    console:
      enabled: true
logging:
  level:
    org.springframework.batch: INFO
